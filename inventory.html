<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庫存管理 - 橙興生活文創</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 應用程式模組 -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 70px;
        }

        /* 導航列樣式 */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .nav-brand a {
            font-size: 1.3em;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 5px;
        }

        .nav-links a {
            padding: 8px 15px;
            color: #555;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #f0f0f0;
            color: #667eea;
        }

        .nav-links a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-size: 0.9em;
            color: #333;
        }

        .user-role {
            font-size: 0.75em;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .auth-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .logout-btn {
            background: #f0f0f0;
            color: #666;
        }

        .logout-btn:hover {
            background: #e0e0e0;
        }

        /* 主要內容區 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .page-header h1 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #666;
        }

        /* 統計卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .stat-card .label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
            color: #333;
        }

        .stat-card.warning .value {
            color: #f39c12;
        }

        .stat-card.danger .value {
            color: #e74c3c;
        }

        .stat-card.success .value {
            color: #27ae60;
        }

        /* 工具列 */
        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            background: white;
            cursor: pointer;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 庫存表格 */
        .inventory-table-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
        }

        .inventory-table th,
        .inventory-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .inventory-table th {
            background: #fafafa;
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inventory-table tbody tr:hover {
            background: #f8f9ff;
        }

        .stock-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .stock-status.normal {
            background: #e8f5e9;
            color: #27ae60;
        }

        .stock-status.low {
            background: #fff3e0;
            color: #f39c12;
        }

        .stock-status.critical {
            background: #ffebee;
            color: #e74c3c;
        }

        .stock-status.overstock {
            background: #e3f2fd;
            color: #2196f3;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            margin-right: 5px;
        }

        .action-btn.adjust {
            background: #e8f5e9;
            color: #27ae60;
        }

        .action-btn.adjust:hover {
            background: #c8e6c9;
        }

        .action-btn.history {
            background: #e3f2fd;
            color: #2196f3;
        }

        .action-btn.history:hover {
            background: #bbdefb;
        }

        /* 載入中狀態 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: #666;
            font-size: 1.1em;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #555;
            margin-bottom: 10px;
        }

        /* 未授權訊息 */
        .auth-message {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-message .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .auth-message h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .auth-message p {
            color: #666;
            margin-bottom: 25px;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .filter-group {
                width: 100%;
                flex-wrap: wrap;
            }

            .inventory-table {
                font-size: 0.9em;
            }

            .inventory-table th,
            .inventory-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 載入中覆蓋層 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">載入中...</div>
    </div>

    <!-- 導航列 -->
    <nav class="nav-bar" id="navBar">
        <div class="nav-brand">
            <a href="index.html">🛍️ 橙興生活文創</a>
        </div>
        <div class="nav-links">
            <a href="products.html">商品查詢</a>
            <a href="inventory.html" class="active">庫存管理</a>
            <a href="purchase.html" class="auth-required" data-min-role="staff">進貨作業</a>
            <a href="sales.html" class="auth-required" data-min-role="staff">銷貨作業</a>
            <a href="reports.html" class="auth-required" data-min-role="manager">報表中心</a>
            <a href="admin.html" class="auth-required" data-min-role="admin">系統管理</a>
        </div>
        <div class="user-menu" id="userMenu">
            <div class="guest-actions" id="guestActions">
                <a href="login.html" class="auth-btn login-btn">登入</a>
            </div>
            <div class="user-info" id="userInfo" style="display: none;">
                <span class="user-name" id="userName"></span>
                <span class="user-role" id="userRole"></span>
                <button class="auth-btn logout-btn" onclick="handleLogout()">登出</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 未授權訊息 -->
        <div class="auth-message" id="authMessage" style="display: none;">
            <div class="icon">🔒</div>
            <h2>需要登入</h2>
            <p>您需要登入才能存取庫存管理功能</p>
            <a href="login.html" class="btn btn-primary">前往登入</a>
        </div>

        <!-- 主要內容（需要認證） -->
        <div id="mainContent" style="display: none;">
            <div class="page-header">
                <h1>📦 庫存管理</h1>
                <p>即時監控商品庫存狀態，進行庫存調整與追蹤</p>
            </div>

            <!-- 統計卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">商品總數</div>
                    <div class="value" id="totalProducts">0</div>
                </div>
                <div class="stat-card success">
                    <div class="label">庫存正常</div>
                    <div class="value" id="normalStock">0</div>
                </div>
                <div class="stat-card warning">
                    <div class="label">庫存偏低</div>
                    <div class="value" id="lowStock">0</div>
                </div>
                <div class="stat-card danger">
                    <div class="label">需要補貨</div>
                    <div class="value" id="criticalStock">0</div>
                </div>
            </div>

            <!-- 工具列 -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜尋商品編號、名稱或條碼...">
                </div>
                <div class="filter-group">
                    <select id="statusFilter">
                        <option value="all">全部狀態</option>
                        <option value="normal">庫存正常</option>
                        <option value="low">庫存偏低</option>
                        <option value="critical">需要補貨</option>
                        <option value="overstock">庫存過多</option>
                    </select>
                    <select id="categoryFilter">
                        <option value="all">全部分類</option>
                    </select>
                    <button class="btn btn-secondary" onclick="exportInventory()">📥 匯出</button>
                    <button class="btn btn-primary" onclick="refreshInventory()">🔄 重新整理</button>
                </div>
            </div>

            <!-- 庫存表格 -->
            <div class="inventory-table-wrapper">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>商品編號</th>
                            <th>商品名稱</th>
                            <th>分類</th>
                            <th>現有庫存</th>
                            <th>安全庫存</th>
                            <th>狀態</th>
                            <th>最後更新</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- 動態內容 -->
                    </tbody>
                </table>

                <!-- 空狀態 -->
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="icon">📦</div>
                    <h3>尚無庫存資料</h3>
                    <p>開始新增商品或匯入現有資料</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 全域變數 ==========
        let inventoryData = [];
        let currentUser = null;
        let userRole = null;

        // ========== 認證相關 ==========
        async function checkAuth() {
            const mainContent = document.getElementById('mainContent');
            const authMessage = document.getElementById('authMessage');
            
            // 檢查 Supabase 是否啟用
            if (typeof window.APP_CONFIG === 'undefined' || !window.APP_CONFIG.ENABLE_SUPABASE) {
                // 開發模式：顯示示範資料
                mainContent.style.display = 'block';
                authMessage.style.display = 'none';
                loadDemoData();
                return;
            }
            
            try {
                currentUser = await getCurrentUser();
                
                if (currentUser) {
                    userRole = await getUserRole();
                    
                    // 檢查權限（至少需要 staff）
                    if (hasPermission('staff')) {
                        mainContent.style.display = 'block';
                        authMessage.style.display = 'none';
                        await loadInventoryData();
                    } else {
                        mainContent.style.display = 'none';
                        authMessage.style.display = 'block';
                        document.querySelector('.auth-message h2').textContent = '權限不足';
                        document.querySelector('.auth-message p').textContent = '您的帳號沒有存取庫存管理的權限';
                    }
                } else {
                    mainContent.style.display = 'none';
                    authMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('認證檢查失敗:', error);
                mainContent.style.display = 'none';
                authMessage.style.display = 'block';
            }
            
            updateAuthUI();
        }

        async function updateAuthUI() {
            const guestActions = document.getElementById('guestActions');
            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');
            const userRoleEl = document.getElementById('userRole');
            
            if (currentUser) {
                guestActions.style.display = 'none';
                userInfo.style.display = 'flex';
                userName.textContent = currentUser.email;
                
                const roleNames = { admin: '管理員', manager: '主管', staff: '員工' };
                userRoleEl.textContent = roleNames[userRole] || userRole;
            } else {
                guestActions.style.display = 'flex';
                userInfo.style.display = 'none';
            }
        }

        async function handleLogout() {
            if (typeof logout === 'function') {
                try {
                    await logout();
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('登出失敗:', error);
                    alert('登出失敗，請稍後再試');
                }
            }
        }

        // ========== 資料載入 ==========
        async function loadInventoryData() {
            showLoading(true);
            
            try {
                const client = getSupabaseClient();
                
                if (!client) {
                    loadDemoData();
                    return;
                }
                
                const { data, error } = await client
                    .from('products')
                    .select('*')
                    .order('code');
                
                if (error) throw error;
                
                inventoryData = data || [];
                renderInventory();
                updateStats();
                
            } catch (error) {
                console.error('載入庫存資料失敗:', error);
                loadDemoData();
            } finally {
                showLoading(false);
            }
        }

        function loadDemoData() {
            // 示範資料
            inventoryData = [
                { id: 1, code: 'A001', name: '手工皂禮盒', category: '禮盒', stock_quantity: 50, min_stock: 20, updated_at: new Date().toISOString() },
                { id: 2, code: 'A002', name: '精油蠟燭', category: '香氛', stock_quantity: 15, min_stock: 20, updated_at: new Date().toISOString() },
                { id: 3, code: 'A003', name: '乾燥花束', category: '花藝', stock_quantity: 8, min_stock: 10, updated_at: new Date().toISOString() },
                { id: 4, code: 'A004', name: '手作飾品組', category: '飾品', stock_quantity: 100, min_stock: 30, updated_at: new Date().toISOString() },
                { id: 5, code: 'A005', name: '環保購物袋', category: '生活', stock_quantity: 5, min_stock: 15, updated_at: new Date().toISOString() },
            ];
            
            renderInventory();
            updateStats();
        }

        // ========== 介面渲染 ==========
        function renderInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            const emptyState = document.getElementById('emptyState');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            // 過濾資料
            let filtered = inventoryData.filter(item => {
                // 搜尋過濾
                const matchesSearch = !searchTerm || 
                    item.code?.toLowerCase().includes(searchTerm) ||
                    item.name?.toLowerCase().includes(searchTerm) ||
                    item.barcode?.toLowerCase().includes(searchTerm);
                
                // 狀態過濾
                const status = getStockStatus(item);
                const matchesStatus = statusFilter === 'all' || status === statusFilter;
                
                return matchesSearch && matchesStatus;
            });
            
            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            tbody.innerHTML = filtered.map(item => {
                const status = getStockStatus(item);
                const statusText = getStatusText(status);
                const updatedAt = item.updated_at ? formatDate(new Date(item.updated_at)) : '-';
                
                return `
                    <tr>
                        <td><strong>${escapeHtml(item.code || '')}</strong></td>
                        <td>${escapeHtml(item.name || '')}</td>
                        <td>${escapeHtml(item.category || '-')}</td>
                        <td><strong>${item.stock_quantity || 0}</strong></td>
                        <td>${item.min_stock || 0}</td>
                        <td><span class="stock-status ${status}">${statusText}</span></td>
                        <td>${updatedAt}</td>
                        <td>
                            <button class="action-btn adjust" onclick="adjustStock(${item.id})">調整</button>
                            <button class="action-btn history" onclick="viewHistory(${item.id})">紀錄</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStockStatus(item) {
            const stock = item.stock_quantity || 0;
            const minStock = item.min_stock || 10;
            const maxStock = (item.max_stock || minStock * 5);
            
            if (stock <= minStock * 0.5) return 'critical';
            if (stock <= minStock) return 'low';
            if (stock > maxStock) return 'overstock';
            return 'normal';
        }

        function getStatusText(status) {
            const statusMap = {
                normal: '正常',
                low: '偏低',
                critical: '缺貨',
                overstock: '過多'
            };
            return statusMap[status] || status;
        }

        function updateStats() {
            let normal = 0, low = 0, critical = 0;
            
            inventoryData.forEach(item => {
                const status = getStockStatus(item);
                if (status === 'normal' || status === 'overstock') normal++;
                else if (status === 'low') low++;
                else if (status === 'critical') critical++;
            });
            
            document.getElementById('totalProducts').textContent = inventoryData.length;
            document.getElementById('normalStock').textContent = normal;
            document.getElementById('lowStock').textContent = low;
            document.getElementById('criticalStock').textContent = critical;
        }

        // ========== 操作函式 ==========
        function adjustStock(productId) {
            // TODO: 實作庫存調整彈窗
            alert('庫存調整功能開發中...\n商品 ID: ' + productId);
        }

        function viewHistory(productId) {
            // TODO: 實作庫存紀錄查看
            alert('庫存紀錄功能開發中...\n商品 ID: ' + productId);
        }

        function exportInventory() {
            if (typeof exportToCSV === 'function') {
                const exportData = inventoryData.map(item => ({
                    商品編號: item.code,
                    商品名稱: item.name,
                    分類: item.category,
                    現有庫存: item.stock_quantity,
                    安全庫存: item.min_stock,
                    狀態: getStatusText(getStockStatus(item))
                }));
                exportToCSV(exportData, `庫存報表_${formatDate(new Date())}`);
            } else {
                alert('匯出功能載入中，請稍後再試');
            }
        }

        function refreshInventory() {
            loadInventoryData();
        }

        // ========== 工具函式 ==========
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('active', show);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            if (typeof window.formatDate === 'function') {
                return window.formatDate(date);
            }
            return date.toLocaleDateString('zh-TW');
        }

        // ========== 事件監聽 ==========
        document.getElementById('searchInput').addEventListener('input', debounce(renderInventory, 300));
        document.getElementById('statusFilter').addEventListener('change', renderInventory);
        document.getElementById('categoryFilter').addEventListener('change', renderInventory);

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
    </script>
</body>
</html>
