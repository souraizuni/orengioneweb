<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙興生活文創 - 商品查詢系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .search-section {
            display: none;
        }

        .search-section.active {
            display: block;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            padding-left: 45px;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .product-card .product-code {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-card .product-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            min-height: 50px;
        }

        .product-card .product-price {
            font-size: 1.5em;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-card .product-barcode {
            font-size: 0.85em;
            color: #666;
            font-family: monospace;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results .icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .success {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ 橙興生活文創</h1>
            <p>商品查詢系統</p>
        </div>

        <!-- Google Sheet 設定區 -->
        <div class="card" id="setupCard">
            <h2 style="margin-bottom: 20px;">📋 Google Sheet 設定</h2>
            <div class="input-group">
                <label for="sheetUrl">Google Sheet 網址</label>
                <input
                    type="text"
                    id="sheetUrl"
                    placeholder="請貼上 Google Sheet 的分享連結"
                    value="">
            </div>
            <div style="font-size: 0.9em; color: #666; margin-bottom: 15px;">
                <p><strong>設定步驟：</strong></p>
                <ol style="margin-left: 20px; margin-top: 8px;">
                    <li>開啟您的 Google Sheet</li>
                    <li>點選「共用」→「取得連結」</li>
                    <li>設定為「知道連結的人皆可查看」</li>
                    <li>複製連結並貼到上方欄位</li>
                </ol>
                <p style="margin-top: 10px;"><strong>試算表格式要求：</strong></p>
                <p>第一列為標題，需包含：商品編號、商品名稱、售價、條碼</p>
            </div>
            <button class="btn" onclick="loadSheet()">載入商品資料</button>
            <div id="setupMessage"></div>
        </div>

        <!-- 商品查詢區 -->
        <div class="search-section" id="searchSection">
            <div class="card">
                <div class="stats">
                    <div class="stat-card">
                        <div class="number" id="totalProducts">0</div>
                        <div class="label">總商品數</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="displayedProducts">0</div>
                        <div class="label">顯示商品</div>
                    </div>
                </div>

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜尋商品編號、名稱或條碼..."
                        oninput="searchProducts()">
                </div>

                <button class="btn" onclick="resetSheet()" style="background: #95a5a6; margin-top: 10px;">
                    重新設定 Google Sheet
                </button>
            </div>

            <div class="card">
                <div id="productsContainer">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let productsData = [];
        let sheetId = '';

        // 從 Google Sheet URL 提取 Sheet ID
        function extractSheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // 載入 Google Sheet 資料
        async function loadSheet() {
            const urlInput = document.getElementById('sheetUrl');
            const messageDiv = document.getElementById('setupMessage');
            const url = urlInput.value.trim();

            if (!url) {
                messageDiv.innerHTML = '<div class="error">請輸入 Google Sheet 網址</div>';
                return;
            }

            sheetId = extractSheetId(url);
            if (!sheetId) {
                messageDiv.innerHTML = '<div class="error">無效的 Google Sheet 網址格式</div>';
                return;
            }

            messageDiv.innerHTML = '<div class="loading">載入中，請稍候...</div>';

            try {
                // 使用 Google Sheets JSON API
                const apiUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error('無法讀取 Google Sheet，請確認分享設定是否正確');
                }

                const text = await response.text();
                // Google 回傳的格式是 JSONP，需要處理
                const jsonText = text.substring(47).slice(0, -2);
                const data = JSON.parse(jsonText);

                // 解析資料
                parseSheetData(data);

                // 儲存到 localStorage
                localStorage.setItem('sheetUrl', url);
                localStorage.setItem('sheetId', sheetId);

                messageDiv.innerHTML = '<div class="success">✓ 成功載入 ' + productsData.length + ' 筆商品資料！</div>';

                // 顯示搜尋區
                setTimeout(() => {
                    document.getElementById('setupCard').style.display = 'none';
                    document.getElementById('searchSection').classList.add('active');
                    displayProducts(productsData);
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error">載入失敗：' + error.message + '<br>請確認：<br>1. Google Sheet 已設為「知道連結的人皆可查看」<br>2. 網址格式正確</div>';
            }
        }

        // 解析 Google Sheet 資料
        function parseSheetData(data) {
            productsData = [];
            const rows = data.table.rows;

            if (rows.length < 2) {
                throw new Error('試算表資料不足');
            }

            // 取得標題列（第一列）
            const headers = rows[0].c.map(cell => cell ? cell.v : '');

            // 找出各欄位的索引
            const codeIndex = headers.findIndex(h => h && h.includes('編號'));
            const nameIndex = headers.findIndex(h => h && h.includes('名稱'));
            const priceIndex = headers.findIndex(h => h && h.includes('價'));
            const barcodeIndex = headers.findIndex(h => h && h.includes('條碼'));

            // 解析每一列資料（從第二列開始）
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row) continue;

                const product = {
                    code: row[codeIndex] ? row[codeIndex].v : '',
                    name: row[nameIndex] ? row[nameIndex].v : '',
                    price: row[priceIndex] ? row[priceIndex].v : '',
                    barcode: row[barcodeIndex] ? row[barcodeIndex].v : ''
                };

                // 只加入有商品編號或名稱的資料
                if (product.code || product.name) {
                    productsData.push(product);
                }
            }
        }

        // 顯示商品
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <h3>找不到符合的商品</h3>
                        <p>請嘗試其他搜尋關鍵字</p>
                    </div>
                `;
                document.getElementById('displayedProducts').textContent = '0';
                return;
            }

            const html = products.map(product => `
                <div class="product-card">
                    <div class="product-code">${escapeHtml(product.code)}</div>
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-price">NT$ ${escapeHtml(String(product.price))}</div>
                    <div class="product-barcode">條碼: ${escapeHtml(product.barcode)}</div>
                </div>
            `).join('');

            container.innerHTML = `<div class="product-grid">${html}</div>`;

            document.getElementById('totalProducts').textContent = productsData.length;
            document.getElementById('displayedProducts').textContent = products.length;
        }

        // 搜尋商品
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!searchTerm) {
                displayProducts(productsData);
                return;
            }

            const filtered = productsData.filter(product => {
                return (
                    String(product.code).toLowerCase().includes(searchTerm) ||
                    String(product.name).toLowerCase().includes(searchTerm) ||
                    String(product.barcode).toLowerCase().includes(searchTerm) ||
                    String(product.price).toLowerCase().includes(searchTerm)
                );
            });

            displayProducts(filtered);
        }

        // 重設 Sheet
        function resetSheet() {
            if (confirm('確定要重新設定 Google Sheet 嗎？')) {
                localStorage.removeItem('sheetUrl');
                localStorage.removeItem('sheetId');
                document.getElementById('setupCard').style.display = 'block';
                document.getElementById('searchSection').classList.remove('active');
                document.getElementById('sheetUrl').value = '';
                document.getElementById('setupMessage').innerHTML = '';
                productsData = [];
            }
        }

        // HTML 轉義
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 頁面載入時檢查是否已有儲存的 Sheet
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('sheetUrl');
            if (savedUrl) {
                document.getElementById('sheetUrl').value = savedUrl;
                loadSheet();
            }
        });
    </script>
</body>
</html>
