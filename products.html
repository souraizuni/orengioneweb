<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙興生活文創 - 商品查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .search-section {
            display: none;
        }

        .search-section.active {
            display: block;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            padding-left: 45px;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .product-card .product-code {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        .product-card .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        .product-card .product-sheet {
            font-size: 0.75em;
            color: #999;
            background: #f9f9f9;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .product-card .product-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            min-height: 50px;
        }

        .product-card .product-price {
            font-size: 1.5em;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .barcode-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .qrcode-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qrcode-container canvas {
            border: 2px solid #f0f0f0;
            padding: 8px;
            background: white;
        }

        .barcode-svg {
            width: 100%;
            height: 80px;
            display: block;
            margin: 0 auto;
        }

        .barcode-text {
            font-size: 0.85em;
            color: #666;
            font-family: monospace;
            word-break: break-all;
            text-align: center;
            max-width: 100%;
        }

        .sheet-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .sheet-tab {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .sheet-tab:hover {
            border-color: #667eea;
        }

        .sheet-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .sheet-tab.all {
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results .icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .success {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ 橙興生活文創</h1>
            <p>商品查詢系統</p>
        </div>

        <!-- Google Sheet 設定區 -->
        <div class="card" id="setupCard">
            <h2 style="margin-bottom: 20px;">📋 Google Sheet 設定</h2>
            <div class="input-group">
                <label for="sheetUrl">Google Sheet 網址</label>
                <input
                    type="text"
                    id="sheetUrl"
                    placeholder="請貼上 Google Sheet 的分享連結"
                    value="">
            </div>
            <div style="font-size: 0.9em; color: #666; margin-bottom: 15px;">
                <p><strong>設定步驟：</strong></p>
                <ol style="margin-left: 20px; margin-top: 8px;">
                    <li>開啟您的 Google Sheet</li>
                    <li>點選「共用」→「取得連結」</li>
                    <li>設定為「知道連結的人皆可查看」</li>
                    <li>複製連結並貼到上方欄位</li>
                </ol>
                <p style="margin-top: 10px;"><strong>試算表格式要求：</strong></p>
                <p>第一列為標題，需包含：商品編號、商品名稱、售價、條碼</p>
            </div>
            <button class="btn" onclick="loadSheet()">載入商品資料</button>
            <div id="setupMessage"></div>
        </div>

        <!-- 商品查詢區 -->
        <div class="search-section" id="searchSection">
            <div class="card">
                <div class="sheet-tabs" id="sheetTabs"></div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="number" id="totalProducts">0</div>
                        <div class="label">總商品數</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="displayedProducts">0</div>
                        <div class="label">顯示商品</div>
                    </div>
                </div>

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜尋商品編號、名稱或條碼..."
                        oninput="searchProducts()">
                </div>

                <button class="btn" onclick="resetSheet()" style="background: #95a5a6; margin-top: 10px;">
                    重新設定 Google Sheet
                </button>
            </div>

            <div class="card">
                <div id="productsContainer">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let productsData = [];
        let sheetId = '';
        let allSheets = [];
        let currentSheetFilter = 'all';

        // 從 Google Sheet URL 提取 Sheet ID
        function extractSheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // 載入 Google Sheet 資料（所有工作表）
        async function loadSheet() {
            const urlInput = document.getElementById('sheetUrl');
            const messageDiv = document.getElementById('setupMessage');
            const url = urlInput.value.trim();

            if (!url) {
                messageDiv.innerHTML = '<div class="error">請輸入 Google Sheet 網址</div>';
                return;
            }

            sheetId = extractSheetId(url);
            if (!sheetId) {
                messageDiv.innerHTML = '<div class="error">無效的 Google Sheet 網址格式</div>';
                return;
            }

            messageDiv.innerHTML = '<div class="loading">載入中，請稍候...</div>';

            try {
                // 使用 Google Sheets JSON API 獲取所有工作表
                await loadAllSheets();

                // 儲存到 localStorage
                localStorage.setItem('sheetUrl', url);
                localStorage.setItem('sheetId', sheetId);

                if (productsData.length === 0) {
                    throw new Error('未能從任何工作表中讀取資料');
                }

                messageDiv.innerHTML = '<div class="success">✓ 成功載入 ' + productsData.length + ' 筆商品資料！</div>';

                // 顯示搜尋區
                setTimeout(() => {
                    document.getElementById('setupCard').style.display = 'none';
                    document.getElementById('searchSection').classList.add('active');
                    renderSheetTabs();
                    // 預設不顯示商品，只顯示搜尋框
                    displayProducts([]);
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error">載入失敗：' + error.message + '<br>請確認：<br>1. Google Sheet 已設為「知道連結的人皆可查看」<br>2. 網址格式正確</div>';
            }
        }

        // 載入所有工作表
        async function loadAllSheets() {
            productsData = [];
            allSheets = [];
            console.log('開始載入統合工作表...');
            
            try {
                // 載入統合工作表 (gid=1774941099)
                const apiUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=1774941099`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                if (text.includes('error')) {
                    throw new Error('API 錯誤');
                }

                const jsonText = text.substring(47).slice(0, -2);
                let data;
                try {
                    data = JSON.parse(jsonText);
                } catch (e) {
                    throw new Error('JSON 解析失敗');
                }

                if (!data.table || !data.table.rows || data.table.rows.length === 0) {
                    throw new Error('無資料列');
                }

                const sheetData = [];
                const sheetName = '全部商品';
                
                parseSheetDataWithSheet(data, sheetName, sheetData);
                
                if (sheetData.length > 0) {
                    console.log(`✓ 成功載入統合工作表: ${sheetData.length} 筆商品`);
                    allSheets.push({
                        name: sheetName,
                        data: sheetData,
                        gid: 1774941099
                    });
                    productsData.push(...sheetData);
                } else {
                    throw new Error('無有效商品資料');
                }
                
                console.log(`載入完成: ${productsData.length} 筆商品`);
            } catch (error) {
                console.error('載入失敗:', error.message);
                throw error;
            }
        }

        // 解析 Google Sheet 資料（含工作表名稱）
        function parseSheetDataWithSheet(data, sheetName, output) {
            const rows = data.table.rows;
            const cols = data.table.cols;

            if (rows.length < 1) {
                console.log(`[${sheetName}] 無資料列`);
                return;
            }

            // 找出欄位索引
            let sheetIndex = -1;      // _sheet 欄位
            let codeIndex = -1;       // 產品編號
            let nameIndex = -1;       // 品名
            let barcodeIndex = -1;    // 國際條碼
            let priceIndex = -1;      // 售價

            for (let i = 0; i < cols.length; i++) {
                const label = (cols[i].label || '').trim();
                
                if (label === '_sheet') sheetIndex = i;
                if (label.includes('產品編號')) codeIndex = i;
                if (label.includes('品名')) nameIndex = i;
                if (label.includes('國際條碼') || label.includes('條碼')) barcodeIndex = i;
                if (label.includes('售價')) priceIndex = i;
            }

            // 如果沒有找到，使用預設位置
            if (sheetIndex === -1) sheetIndex = 0;
            if (codeIndex === -1) codeIndex = 2;
            if (nameIndex === -1) nameIndex = 3;
            if (barcodeIndex === -1) barcodeIndex = 4;
            if (priceIndex === -1) priceIndex = 5;

            console.log(`[${sheetName}] 欄位位置: sheet=${sheetIndex}, 編號=${codeIndex}, 名稱=${nameIndex}, 條碼=${barcodeIndex}, 價=${priceIndex}`);

            const categoryMap = {};  // 用於按分類分組
            let validCount = 0;

            // 載入所有行（包括編號或品名為空的）
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row) continue;

                // 安全地取得欄位值
                const getCell = (idx) => {
                    if (idx < 0 || idx >= row.length) return '';
                    const cell = row[idx];
                    if (!cell) return '';
                    return cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
                };

                const category = getCell(sheetIndex) || '未分類';
                const code = getCell(codeIndex);
                const name = getCell(nameIndex);
                const barcode = getCell(barcodeIndex);
                const price = getCell(priceIndex);

                // 將所有有值的商品加入（即使缺少編號或品名）
                const product = {
                    code: code,
                    name: name,
                    price: price,
                    barcode: barcode,
                    category: category,
                    sheet: category,
                    hasCode: !!code,
                    hasName: !!name
                };

                // 只有同時有編號和名稱才認為是"有效"商品（用於搜尋篩選）
                if (code && name) {
                    validCount++;
                }

                output.push(product);

                // 統計各分類
                if (!categoryMap[category]) {
                    categoryMap[category] = 0;
                }
                categoryMap[category]++;
            }

            console.log(`[${sheetName}] 共載入 ${output.length} 筆商品，其中有效商品 ${validCount} 筆，分布在 ${Object.keys(categoryMap).length} 個分類`);
            
            // 顯示分類統計
            Object.entries(categoryMap)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .forEach(([cat, count]) => {
                    console.log(`  - ${cat}: ${count} 筆`);
                });
        }

        // 解析 Google Sheet 資料（第一個工作表）
        function parseSheetData(data, sheetName = 'Sheet1') {
            const rows = data.table.rows;
            const cols = data.table.cols;

            if (rows.length < 1) {
                throw new Error('試算表資料不足');
            }

            // 查找所有的欄位組（多個編號-品名-條碼-售價的重複組）
            const fieldGroups = [];
            let currentGroup = { codeIndex: -1, nameIndex: -1, barcodeIndex: -1, priceIndex: -1 };

            for (let i = 0; i < cols.length; i++) {
                const label = (cols[i].label || '').trim();
                
                // 跳過完全空白標籤
                if (!label) {
                    continue;
                }
                
                // 跳過序號標籤
                if (label === 'z' || label === '序號' || label === '(空)') {
                    // 如果當前組有編號欄位，表示這是新的分組起點
                    if (currentGroup.codeIndex !== -1) {
                        fieldGroups.push({ ...currentGroup });
                        currentGroup = { codeIndex: -1, nameIndex: -1, barcodeIndex: -1, priceIndex: -1 };
                    }
                    continue;
                }
                
                if (label.includes('編號')) {
                    // 如果已有編號，開始新組
                    if (currentGroup.codeIndex !== -1) {
                        fieldGroups.push({ ...currentGroup });
                        currentGroup = { codeIndex: -1, nameIndex: -1, barcodeIndex: -1, priceIndex: -1 };
                    }
                    currentGroup.codeIndex = i;
                } else if (label.includes('名稱') || label.includes('品名') || label.includes('商品名')) {
                    if (currentGroup.codeIndex !== -1) {
                        currentGroup.nameIndex = i;
                    }
                } else if (label.includes('條碼') || label.includes('條形碼') || label.includes('ISBN') || label.includes('BARCODE')) {
                    if (currentGroup.codeIndex !== -1) {
                        currentGroup.barcodeIndex = i;
                    }
                } else if (label.includes('特價')) {
                    if (currentGroup.codeIndex !== -1) {
                        currentGroup.priceIndex = i;
                    }
                } else if (label.includes('售價') && currentGroup.priceIndex === -1) {
                    if (currentGroup.codeIndex !== -1) {
                        currentGroup.priceIndex = i;
                    }
                }
            }
            
            // 加入最後一組
            if (currentGroup.codeIndex !== -1) {
                fieldGroups.push(currentGroup);
            }

            // 如果沒有找到多個欄位組，嘗試用預設位置
            if (fieldGroups.length === 0) {
                // 預設：第 1 欄編號，第 2 欄品名，第 3 欄條碼，第 4 欄售價
                fieldGroups.push({
                    codeIndex: 1,
                    nameIndex: 2,
                    barcodeIndex: 3,
                    priceIndex: 4
                });
                console.log(`[${sheetName}] 未找到欄位標籤，使用預設位置: 1,2,3,4`);
            } else {
                console.log(`[${sheetName}] 找到 ${fieldGroups.length} 個欄位組`);
            }

            const sheetData = [];
            let validCount = 0;
            const samples = [];

            // 從每個欄位組中提取商品
            for (const group of fieldGroups) {
                const { codeIndex, nameIndex, barcodeIndex, priceIndex } = group;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (!row) continue;

                    // 安全地取得欄位值
                    const getCell = (idx) => {
                        if (idx < 0 || idx >= row.length) return '';
                        const cell = row[idx];
                        if (!cell) return '';
                        return cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
                    };

                    const product = {
                        code: getCell(codeIndex),
                        name: getCell(nameIndex),
                        price: getCell(priceIndex),
                        barcode: getCell(barcodeIndex),
                        sheet: sheetName
                    };

                    // 只有同時有編號和名稱才認為是有效商品
                    if (product.code && product.name) {
                        sheetData.push(product);
                        validCount++;
                        
                        if (samples.length < 3) {
                            samples.push(`"${product.code}" | "${product.name}"`);
                        }
                    }
                }
            }

            if (sheetData.length > 0) {
                allSheets.push({
                    name: sheetName,
                    data: sheetData
                });
                productsData.push(...sheetData);
            }

            if (validCount > 0) {
                console.log(`[${sheetName}] 解析成功: ${validCount} 筆商品`);
                if (samples.length > 0) {
                    console.log(`[${sheetName}] 樣本: ${samples.join(', ')}`);
                }
            } else {
                console.log(`[${sheetName}] 無有效商品`);
            }

            return sheetData;
        }

        // 渲染工作表標籤
        function renderSheetTabs() {
            const tabsContainer = document.getElementById('sheetTabs');
            tabsContainer.innerHTML = '';

            // 計算有效商品數量（有編號和名稱的）
            const validCount = productsData.filter(p => p.hasCode && p.hasName).length;

            const allTab = document.createElement('button');
            allTab.className = 'sheet-tab all active';
            allTab.textContent = `全部商品 (${validCount}/${productsData.length})`;
            allTab.onclick = () => filterBySheet('all');
            tabsContainer.appendChild(allTab);

            // 按分類分組
            const categoriesMap = {};
            productsData.forEach(product => {
                const category = product.category || '未分類';
                if (!categoriesMap[category]) {
                    categoriesMap[category] = { total: 0, valid: 0 };
                }
                categoriesMap[category].total++;
                if (product.hasCode && product.hasName) {
                    categoriesMap[category].valid++;
                }
            });

            // 按商品數量排序並顯示
            Object.entries(categoriesMap)
                .sort((a, b) => b[1].valid - a[1].valid)
                .forEach(([category, counts]) => {
                    const tab = document.createElement('button');
                    tab.className = 'sheet-tab';
                    tab.textContent = `${category} (${counts.valid}/${counts.total})`;
                    tab.onclick = () => filterBySheet(category);
                    tabsContainer.appendChild(tab);
                });
        }

        // 按工作表過濾
        function filterBySheet(category) {
            currentSheetFilter = category;

            // 更新標籤外觀
            document.querySelectorAll('.sheet-tab').forEach(tab => {
                tab.classList.remove('active');
                if (category === 'all' && tab.classList.contains('all')) {
                    tab.classList.add('active');
                } else if (category !== 'all' && tab.textContent.startsWith(category)) {
                    tab.classList.add('active');
                }
            });

            // 過濾商品
            let filtered = productsData;
            if (category !== 'all') {
                filtered = productsData.filter(p => p.category === category);
            }

            displayProducts(filtered);
        }

        // 顯示商品
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <h3>找不到符合的商品</h3>
                        <p>請嘗試其他搜尋關鍵字</p>
                    </div>
                `;
                document.getElementById('displayedProducts').textContent = '0';
                return;
            }

            const html = products.map((product, index) => `
                <div class="product-card">
                    <div class="product-header">
                        <div class="product-code">${escapeHtml(product.code)}</div>
                        <div class="product-sheet">${escapeHtml(product.sheet)}</div>
                    </div>
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-price">NT$ ${escapeHtml(String(product.price))}</div>
                    
                    <div class="barcode-section">
                        <svg id="barcode-${index}" class="barcode-svg"></svg>
                        <div class="barcode-text">${escapeHtml(product.barcode)}</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="product-grid">${html}</div>`;

            // 為每個商品生成條形碼
            products.forEach((product, index) => {
                if (product.barcode) {
                    try {
                        JsBarcode(`#barcode-${index}`, product.barcode, {
                            format: "CODE128",
                            width: 2,
                            height: 80,
                            displayValue: false,
                            margin: 5
                        });
                    } catch (e) {
                        console.log(`生成條形碼失敗: ${e.message}`);
                    }
                }
            });

            const totalCount = currentSheetFilter === 'all' 
                ? productsData.length 
                : productsData.filter(p => p.category === currentSheetFilter).length;
            
            document.getElementById('totalProducts').textContent = totalCount;
            document.getElementById('displayedProducts').textContent = products.length;
        }

        // 搜尋商品
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            // 如果沒有輸入搜尋詞，不顯示任何商品
            if (!searchTerm) {
                displayProducts([]);
                return;
            }

            // 先按分類過濾
            let filtered = productsData;
            if (currentSheetFilter !== 'all') {
                filtered = productsData.filter(p => p.category === currentSheetFilter);
            }

            // 再按搜尋詞過濾，只搜尋編號和名稱都有值的商品
            filtered = filtered.filter(product => {
                // 只考慮有編號和名稱的商品
                if (!product.hasCode || !product.hasName) {
                    return false;
                }
                
                return (
                    String(product.code).toLowerCase().includes(searchTerm) ||
                    String(product.name).toLowerCase().includes(searchTerm)
                );
            });

            displayProducts(filtered);
        }

        // 重設 Sheet
        function resetSheet() {
            if (confirm('確定要重新設定 Google Sheet 嗎？')) {
                localStorage.removeItem('sheetUrl');
                localStorage.removeItem('sheetId');
                document.getElementById('setupCard').style.display = 'block';
                document.getElementById('searchSection').classList.remove('active');
                document.getElementById('sheetUrl').value = '';
                document.getElementById('setupMessage').innerHTML = '';
                productsData = [];
                allSheets = [];
                currentSheetFilter = 'all';
            }
        }

        // HTML 轉義
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 頁面載入時檢查是否已有儲存的 Sheet
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('sheetUrl');
            if (savedUrl) {
                document.getElementById('sheetUrl').value = savedUrl;
                loadSheet();
            }
        });
    </script>
</body>
</html>
