<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙興生活文創有限公司</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .nav-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-btn {
            display: inline-block;
            background: white;
            color: #667eea;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .nav-btn:active {
            transform: translateY(0);
        }
        @media (max-width: 768px) {
            .nav-buttons {
                flex-direction: column;
                padding: 0 20px;
            }
            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <div class="nav-buttons">
            <a href="products.html" class="nav-btn">🛍️ 商品查詢系統</a>
            <a href="qrcode.html" class="nav-btn">📱 產品頁面</a>
        </div>
    </div>
    <img src="image.png" alt="橙興生活文創有限公司">
</body>
</html>
